alerts:
  - name: FastRequestLatencyHigh
    severity: page
    condition: "latency_p95_ms > 3000"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1
  - name: RequestErrorRateHigh
    severity: page
    condition: "error_rate_pct > 2"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessLow
    severity: ticket
    condition: "retrieval_success_rate_pct < 90"
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: retrieval-oncall
    runbook: docs/alerts.md#alert-3
